<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliativa Vetor</title>
</head>
<body>
    <h1>ANIL OSAG</h1>
    <label for="slc_comb">Combústivel vendido</label>
    <select id="slc_comb">
        <option value="#" disabled selected>Selecione uma opção</option>
        <option value="6.49">Gasolina</option>
        <option value="4.44">Etanol</option>
        <option value="4.39">Diesel</option>
    </select>
    <br>
    <label for="ipt_qtd">Litros vendidos: </label>
    <input type="number" id="ipt_qtd">
    <br>
    <label for="ipt_hora">Hora da venda: </label>
    <input type="number" id="ipt_hora">
    <br>
    <button onclick="adicionar()">Adicionar venda</button>
    <button onclick="encerrar()">Encerrar o dia</button>
    <div id="div_result"></div>
</body>
</html>
<script>

venda = 1;
valor += Number(slc_comb.value);



    function adicionar() {
    let litros = Number(ipt_qtd.value);
    let valorTotal = valor * litros;
    let horaVenda = Number(ipt_hora.value);
    let descGasolina = valor - (valor * 0.505);
    let valorDescGasolina = descGasolina * valorTotal;
    let descDiesel = valor - (valor * 0.408);
    let valorDescDiesel = descDiesel * valorTotal;
    let descEtanol = valor - (valor * 0.439);
    let valorDescEtanol = descEtanol * valorTotal;

    

    if(valor == 6.49 && litros >= 20 && (horaVenda >= 6 && horaVenda <= 21)){
        
        div_result.innerHTML+=`Venda ${venda}ª – Valor Recebido = R$ ${valorDescGasolina.toFixed(2)} – Desconto Concedido = R$${(valor *0.505).toFixed(2)} por Litro – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc <br>`
        venda = venda + 1;

    } else if(valor == 4.39 && litros >= 20 && (horaVenda >= 6 && horaVenda <= 21)){

    div_result.innerHTML+=`Venda ${venda}ª – Valor Recebido = R$ ${valorDescDiesel.toFixed(2)} – Desconto Concedido = R$${(valor *0.408).toFixed(2)} por Litro – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc <br>`
        venda = venda + 1;

    }else if(valor == 4.44 && litros >= 20 && (horaVenda >= 6 && horaVenda <= 21)) {

        div_result.innerHTML+=`Venda ${venda}ª – Valor Recebido = R$ ${valorDescEtanol.toFixed(2)} – Desconto Concedido = R$${(valor *0.439).toFixed(2)} por Litro – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc <br>`
        venda = venda + 1;

    }else if(valor == 6.49) {

        div_result.innerHTML+=`Venda ${venda}ª – Valor Recebido = R$ ${valorTotal.toFixed(2)} – Desconto Concedido = R$00,00 por Litro – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc <br>`
        venda = venda + 1;

    } else if(valor == 4.39){

        div_result.innerHTML+=`Venda ${venda}ª – Valor Recebido = R$ ${valorTotal.toFixed(2)} – Desconto Concedido = R$00,00 – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc <br>`
        venda = venda + 1;

    } else if(valor == 4.44) {

        div_result.innerHTML+=`Venda ${venda}ª – Valor Recebido = R$ ${valorDescEtanol.toFixed(2)} – Desconto Concedido = R$${(valor *0.439).toFixed(2)} por Litro – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc <br>`
        venda = venda + 1;

    }
}

    function encerrar() {

        div_result.innerHTML=` `

    }
</script>
<!--
A família Osag é dona do posto de combustíveis ANIL OSAG, famoso na região de Bauru por sempre vender produtos de alta qualidade. Nesse posto somente são comercializados combustíveis do tipo comum (sem aditivo ou tipo premium) que são: GASOLINA, ETANO E DIESEL.

 

Parte-1

 

A família necessita de um programa para fazer o controle do faturamento do dia, para isso receba:

·         Combustível vendido (“gasolina”, “etanol, “diesel”)

·         A quantidade vendida

·         Hora da venda (00 a 23 – somente a hora, sem os minutos)

 

Considere os seguintes preços de venda:

·         Gasolina – R$ 6,49 por litro

·         Etanol – R$ 4,44 por litro

·         Diesel – R$ 4,39 por litro

 

Para as vendas com a quantidade a partir de 20 litros e realizadas a partir das 21hs até às 06hs (INCLUSIVE) do dia seguinte haverá os seguintes descontos:

·         Gasolina – 5,05%

·         Etanol – 4,8%

·         Diesel – 3,03%

 

Relatório de Vendas - Para cada venda emitir uma linha na página (sem apagar as anteriores), abaixo do(s) botão(ões) da seguinte forma:

Venda xxª – Valor Recebido = R$ aaaa,aa – Desconto Concedido = R$ bbbb,bb – Acumulado dos Recebimentos= R$ cccc,cc - Acumulado dos Descontos = R$ cccc,cc

 

Onde   xx é a ordem sequencial das vendas

                aaaa,aa é o valor recebido, ou seja, já com o desconto (se houver)

                bbbb,bb é o valor do desconto ( se houver )

                cccc,cc é o valor acumulado dos valores recebidos

                dddd,dd é o valor acumulado dos descontos concedidos

 

 

Parte-2

 

Tenha um botão “encerrar o dia” que quando clicado irá:

1.      Apagar todas as mensagens já emitidas pelo programa (se houver)

2.      Emitir o Resumo do Faturamento conforme abaixo

3.      Limpar todos os controles para iniciar um novo Relatório de Vendas

 

Resumo do Faturamento

Valor Total Recebido = R$ cccc,cc

Valor Total dos Descontos = R$ ddd,dd

 

Quantidade de Gasolina Vendida = eee,ee litros == ff,f %

Quantidade de Etanol Vendida = ggg,gg litros == hh,h %

Quantidade de Diesel Vendida = iiii,ii litros == jj,j %

 

Onde   cccc,cc é o valor acumulado dos valores recebidos

                dddd,dd é o valor acumulado dos descontos concedidos

                eee,ee é a quantidade acumulada de gasolina vendida

                fff,f é o percentual das vendas de gasolina em relação a todos combustíveis

                ggg,gg é a quantidade acumulada de etanol vendida

                hhh,h é o percentual das vendas de etanol em relação a todos combustíveis

                iii,ii é a quantidade acumulada de diesel vendido

                jjj,j é o percentual das vendas de diesel em relação a todos combustíveis
