<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    <label for="ipt_senha">Insira uma senha: </label>
    <input type="password" id="ipt_senha" oninput="mostrar()">
    <div id="div_result"></div>
</body>
</html>
<script>
    function mostrar() {
        let senha = ipt_senha.value;
        let senhaForte = senha.replaceAll('a', '@').replaceAll('A', '@').replaceAll('e', '3').replaceAll('E', '3');

        div_result.innerHTML=`${senhaForte}`
    }
</script>
