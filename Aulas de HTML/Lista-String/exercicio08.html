<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
</head>
<body>
    <h1>Jogo da palavra secreta</h1>
    <label for="ipt_letra">Digite uma letra: </label>
    <input type="text" id="ipt_letra">
    <br>
    <button onclick="verificar()">Verificar Letras</button>
    <div id="div_result"></div>
</body>
</html>
<script>

let palavra = 'morango';

    function verificar() {
        let letra = ipt_letra.value.toLowerCase();
        let palavraMinuscula = palavra.toLowerCase();

         
        if(palavraMinuscula.includes(letra)) {
            div_result.innerHTML=`A letra ${letra} aparece na palavra secreta!`
        } else {
            div_result.innerHTML=`A letra ${letra} não aparece na palavra secreta`
        }
    }
</script>

<!-- a) Defina uma palavra secreta no código, ao iniciar a página (ex: "morango").

b) Solicite letras para o usuário.

c) Ao clicar num botão "Verificar Letras":

    c1) Caso as letras inseridas existam na palavra secreta, exiba "A letra XX aparece na palavra secreta!"

    c2) Caso contrário, exiba "A letra XX não aparece na palavra secreta!"

OBS: nesse momento, ainda existem algumas limitações devido à falta de vetores ou estruturas de repetição, portanto, pode considerar "letras repetidas" como sendo uma letra só.
-->
