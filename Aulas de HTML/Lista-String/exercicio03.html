<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
</head>
<body>
    <h1>Primeira e ultima letra</h1>
    <label for="ipt_frase">Digite uma frase: </label>
    <input type="text" id="ipt_frase">
    <br>
    <label for="ipt_palavra">Digite uma palavra: </label>
    <input type="text" id="ipt_palavra">
    <button onclick="analisar()">Analisar frase</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let frase = ipt_frase.value;
        let palavra = ipt_palavra.value;

        if(frase.startsWith(palavra) && frase.endsWith(palavra)){
            div_result.innerHTML=`A frase começa e termina com ${palavra}!,`
        } else if(frase.startsWith(palavra)){
            div_result.innerHTML=`A frase começa com ${palavra}`
        } else if(frase.endsWith(palavra)){
            div_result.innerHTML=`A frase termina com ${palavra}`
        }else {
            div_result.innerHTML=`A frase não começa e nem termina com ${palavra}`
        }

    }
</script>
