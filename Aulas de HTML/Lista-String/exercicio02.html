<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>
    <h1>Detector de palavras</h1>
    <label for="ipt_frase">Digite uma frase: </label>
    <input type="text" id="ipt_frase">
    <br>
    <button onclick="analisar()">Analisar Frase</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let frase = ipt_frase.value;

        if(frase.includes('Teste') || frase.includes('abc') || frase.includes('spam')) {
            div_result.innerHTML=`<span style="color: red;">Frase Inválida</span>`
        } else {
            div_result.innerHTML=`<span style="color: green;">Frase Válida!</span>`
        }
    }
</script>
