<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7</title>
</head>
<body>
    <h1>Validação de senha</h1>
    <label for="ipt_senha">Insira uma senha</label>
    <input type="text" id="ipt_senha" oninput="mostrar()">
    <div id="div_result"></div>
</body>
</html>
<script>


    function mostrar() {
        let senha = ipt_senha.value;
        let tamanhoSenha = senha.length;
        let temMaiuscula = senha !== senha.toUpperCase();
        let temMinuscula = senha !== senha.toLowerCase();
        
        let criterios = 0;

        if(tamanhoSenha >= 8){
            criterios = criterios + 1;
        } 

        if(temMaiuscula) {
            criterios = criterios + 1;
            
        }

        if(temMinuscula) {
            criterios = criterios + 1;
            
        }

        if(criterios == 1){
            div_result.innerHTML=`Fraca`
        }else if(criterios == 2) {
            div_result.innerHTML=`Média`
        }else if(criterios == 3){
            div_result.innerHTML=`Forte`
        }
    }
</script>
