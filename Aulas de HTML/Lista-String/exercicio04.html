<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <h1>Comparador de palavras</h1>
    <label for="ipt_palavra1">Digite uma palavra: </label>
    <input type="text" id="ipt_palavra1">
    <br>
    <label for="ipt_palavra2">Digite outra palavra: </label>
    <input type="text" id="ipt_palavra2">
    <br>
    <button onclick="analisar()">Analisar palavras</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let palavra1 = ipt_palavra1.value;
        let palavra2 = ipt_palavra2.value;
        if(palavra1 == palavra2) {
            div_result.innerHTML=`As palavras ${palavra1} e ${palavra2} são exatamente iguais`
        } else if(palavra1.toLowerCase() == palavra2.toLowerCase()){
            div_result.innerHTML=`As palavras ${palavra1} e ${palavra2} possuem o mesmo contéudo, mas a digitação é diferente(Maiúsculas e minúsculas)`
        } else if(palavra1 !== palavra2) {
            div_result.innerHTML=`As palavras ${palavra1} e ${palavra2}
            são completamente diferentes`
        }
    }
</script>
