<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <h1>Observador de Índices</h1>
    <label for="ipt_frase">Digite uma frase: </label>
    <input type="text" id="ipt_frase" oninput="mostrar()">
    <br>
    <label for="ipt_letra">Qual letra deseja ver: </label>
    <input type="text" id="ipt_letra" oninput="mostrar()">
    <div id="div_result"></div>
</body>
</html>
<script>
    function mostrar() {
        let frase = ipt_frase.value;
        let letra = ipt_letra.value;
        let posicaoLetra = frase[letra];
        let primeiraLetra = frase[0];
        let ultimaPosicao = frase.length - 1
        let ultimaLetra = frase[ultimaPosicao]

        div_result.innerHTML=`A primeira letra é: ${primeiraLetra}<br>
        A ${letra}º letra é: ${posicaoLetra}<br>
        A última letra é: ${ultimaLetra}`
        
    }
</script>
