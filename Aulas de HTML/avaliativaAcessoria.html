<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessória</title>
</head>
<body>
    Distância inicial semanal do aluno (em km).
    <input type="number" id="ipt_distancia"><br>
O percentual de aumento semanal desejado (de 1 a 10).
    <input type="number" id="ipt_aumento"><br>
A meta de distância semanal (em km).
    <input type="number" id="ipt_meta"><br>
O número máximo de semanas do plano.
    <input type="number" id="ipt_maxSemanas"><br>
    <button onclick="analisar()">Gerar planilha</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function analisar() {
        let distancia = Number(ipt_distancia.value);
        let aumento = Number(ipt_aumento.value);
        let percentualAumento = aumento / 100
        let meta = Number(ipt_meta.value);
        let maxSemanas = Number(ipt_maxSemanas.value);
        
        contador = 1;
        

    div_result.innerHTML=``

        if(distancia <= 0 || (aumento < 1 || aumento > 10) || meta <= distancia || (maxSemanas < 1 || maxSemanas > 24)){
            div_result.innerHTML=`Insira valores válidos`
        } else {
            while(contador < maxSemanas && distancia < meta) {
                metaSemana = (distancia / meta) * 100
                if(contador % 4 !== 0) {
                    div_result.innerHTML+=`SEMANA ${contador} - ${distancia.toFixed(2)} km (${metaSemana.toFixed(2)}% da meta)<br>`
                    contador++
                    distancia += distancia * percentualAumento
                } else {
                    let descanso = distancia - (distancia * 0.3)
                    div_result.innerHTML+=`SEMANA ${contador} - ${descanso.toFixed(2)} km (${((descanso / meta) * 100).toFixed(2)}% da meta)<br>`
                    contador++
                    
                }
            }

            if(contador >= maxSemanas) {
                div_result.innerHTML+=`Meta não atingida em ${contador} semanas. A última semana chegou a ${metaSemana.toFixed(2)}% da meta. Total acumulado no plano: ${distancia.toFixed(2)} km.`
            } else if(distancia => meta) {
                div_result.innerHTML+=`Meta de ${meta} km atingida na semana ${contador}! Total acumulado no plano: ${distancia.toFixed(2)} km.`

            }

        }
    }


</script>
