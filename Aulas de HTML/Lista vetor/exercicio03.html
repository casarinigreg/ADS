<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3</title>
</head>
<body>
    <h1>bairro</h1>
    <label for="ipt_bairro">Bairros onde morou: </label>
    <input type="text" id="ipt_bairro">
    <br>
    <label for="ipt_pesquisa">Insira um número: </label>
    <input type="text" id="ipt_pesquisa">
    <br>
    <button onclick="cadastrar()">Cadastrar bairro</button>
    <button onclick="relembrar()">Relembrar moradia</button>
    <div id="div_result"></div>
</body>
</html>
<script>
let bairro = [];

    function cadastrar() {
        bairro.push(ipt_bairro.value)
    }

    function relembrar() {
        let num = Number(ipt_pesquisa.value);

        if(bairro.includes(bairro[num - 1])) {
            div_result.innerHTML=`${bairro[num - 1]}`
        } else {
            div_result.innerHTML=`Você não morou num ${ipt_pesquisa.value}º bairro`
        }
    }

</script>
<!--
Crie um programa o qual:
a) O usuário vá cadastrando os bairros onde morou; Ele digitará o nome do lugar em um campo e clicará em "Cadastrar bairro". 

b) Deve haver um outro campo, em que digita apenas um número, indicando o local onde morou, a partir do número 1 (porque os usuários comuns contam as coisas assim).

c) Após clicar em "Relembrar moradia", faça: 

c.1) Se ele informar "1", exiba o primeiro bairro cadastrado; Se informar "2", exiba o segundo bairro cadastrado e assim por diante ... 

c.2) Porém, ao informar um número maior do que a quantidade de bairros cadastrados, exiba: 

"Você ainda não morou num Xº bairro!" 
-->
