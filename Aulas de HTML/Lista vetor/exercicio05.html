<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    <h1>Seus filmes em destaque</h1>
    <label for="ipt_filme">Insira seus filmes favoritos: </label>
    <input type="text" id="ipt_filme">
    <br>
    <button onclick="cadastrar()">Cadastrar filmes</button>
    <div id="div_result"></div>
</body>
</html>
<script>
let lista = [];

function cadastrar() {
     lista.push(ipt_filme.value);
     ver()
}

function ver() {
    div_result.innerHTML=`Seu filme favorito: ${lista[0]}`

    if(lista.length > 2){
        div_result.innerHTML+=`<br>Seu 3º filme favorito: ${lista[2]}`
    }else {
        div_result.innerHTML+=`<br>Seu 3º filme favorito: Ainda não existe`
    }
    div_result.innerHTML+=`<br>Total de filmes cadastrados: ${lista.length}`

}
</script>
<!--
Crie um programa o qual: 
a) Usuário cadastre os nomes de seus filmes favoritos e adiciona cada um ao clicar em "Cadastrar Filme";

b) Na medida em que vai cadastrando, deve ser exibido ou atualizado um "painel" como neste exemplo: 

  Seu filme favorito: Donnie Darko

  Seu 3º filme favorito: A era do gelo 1 

  Total de filmes cadastrados: 5 

Obs: no "3º filme", caso não tenham sido cadastrados ainda 3 filmes, exibir "Ainda não existe". 

Obs: o "Filme favorito" é o primeiro cadastrado.
-->
