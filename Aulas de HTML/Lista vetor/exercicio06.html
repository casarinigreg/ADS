<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <label for="ipt_filme">Insira seus filmes favoritos em ordem: </label>
    <input type="text" id="ipt_filme">
    <br>
    <button onclick="cadastrar()">Cadastrar filmes</button>
    <div id="div_result"></div>
</body>
</html>
<script>
let lista = [];
    function cadastrar() {
        lista.push(ipt_filme.value)
        mostrar()

    }

    function mostrar(){
        div_result.innerHTML=`
        ${lista}
        `.replaceAll(',', '<br>')
    }
</script>

a) O usuário informa os nomes dos filmes que mais gosta e clica em "Cadastrar";
