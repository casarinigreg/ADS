<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    digite o os nomes das linhas de metro que você pegou essa semana
    <input type="number" id="ipt_linhas">
    <br>
    Pesquisar linhas pegas essa semana
    <input type="number" id="ipt_pesquisa">
    <br>
    <button onclick="gravar()">Gravar metrô</button>
    <button onclick="pesquisar()">Pesquisar</button>
    <div id="div_result"></div>
</body>
</html>
<script>

    let lista = [];

    function gravar() {
        let linhas = ipt_linhas.value;
        lista.push(linhas);

            div_result.innerHTML=``
        for(let i = lista.length - 1; i >= 0; i--) {
            div_result.innerHTML+=`${lista[i]}<br>`
        }
    }

    function pesquisar() {
        let pesquisa = ipt_pesquisa.value;

        if(!lista.includes(pesquisa)) {
            div_result.innerHTML+=`Voce nunca pegou essa linha`
        } else {
            let vezes = 0;
            let indices = [];

            for (let i = 0; i < lista.length; i++) {
                if(lista[i] == pesquisa) {
                    vezes++;
                    indices.push(i + 1);
                }
            }
            div_result.innerHTML=`Você já pegou essa linha ${vezes} vezes, nos índices: ${indices.join(', ')}`;
        }
    }
</script>
