<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Eletrônica</title>
</head>
<body>
    Nome do produto: 
    <input type="text" id="ipt_nome"> <br><br>
    Preço de compra: 
    <input type="number" id="ipt_preco">
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="relatorio()">Relatório de estoque</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    let nomesProdutos = [];
    let precosProdutos = [];

    function cadastrar() {
        let nome = ipt_nome.value;
        let preco = Number(ipt_preco.value);

        nomesProdutos.push(nome);
        precosProdutos.push(preco);

        ipt_nome.value = ``;
        ipt_preco.value = ``;
    }

    function relatorio() {
        div_result.innerHTML = `Total de produtos: ${nomesProdutos.length} <br><br>`;

        if (nomesProdutos.length == 0) {
            return;
        }

        let maiorPreco = precosProdutos[0];
        let indiceMaior = 0;
        let menorPreco = precosProdutos[0];
        let indiceMenor = 0;
        let somaCompra = 0;
        let somaVenda = 0;

        for (let i = 0; i < nomesProdutos.length; i++) {
            let precoVenda = precosProdutos[i] * 1.25;

            div_result.innerHTML += `Produto ${i + 1}: ${nomesProdutos[i]} <br>
            Preço de compra: R$${precosProdutos[i].toFixed(2)}. Vender por R$${precoVenda.toFixed(2)} <br><br>`;

            if (precosProdutos[i] > maiorPreco) {
                maiorPreco = precosProdutos[i];
                indiceMaior = i;
            }
            if (precosProdutos[i] < menorPreco) {
                menorPreco = precosProdutos[i];
                indiceMenor = i;
            }

            somaCompra += precosProdutos[i];
            somaVenda += precoVenda;
        }

        let mediaVenda = somaVenda / nomesProdutos.length;

        div_result.innerHTML += `Produto mais caro: ${nomesProdutos[indiceMaior]} <br>
        Produto mais barato: ${nomesProdutos[indiceMenor]} <br>
        Soma dos preços de compra: R$${somaCompra.toFixed(2)} <br>
        Média de preço de venda: R$${mediaVenda.toFixed(2)}`;
    }
</script>
