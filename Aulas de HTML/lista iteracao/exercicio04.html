<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    Informe nomes de alunos para cadastrar
    <input type="text" id="ipt_aluno">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    let lista = []
    function cadastrar() {
        let alunos = ipt_aluno.value;
        lista.push(alunos)

        div_result.innerHTML=``
        for(let i = lista.length - 1; i >= 0; i--){
            div_result.innerHTML+=`${lista[i]}<br>`
        }
    }
</script>
