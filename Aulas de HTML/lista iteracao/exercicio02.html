<body>
    Informe os seus filmes favoritos
    <input type="text" id="ipt_filmes">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <br>
    <div id="div_result"></div>
</body>

<script>
    function cadastrar() {
        let filmes = ipt_filmes.value;
        let lista = [];
        lista.push(filmes)

        for(let i = 0; i < lista.length; i++) {
            if(i % 2 == 0) {
                div_result.innerHTML+=`filme: ${lista[i]}<br>`
            } else {

            }
        }
    }
</script>
