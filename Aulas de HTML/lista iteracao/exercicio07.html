<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7</title>
</head>
<body>
    Qual o preço do produto?
    <input type="number" id="ipt_valor">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="atualizar()">Aualizar estoque</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    let lista = []
    function cadastrar(){
        let valor = Number(ipt_valor.value);
        lista.push(valor)
    }

    function atualizar() {
        let soma = 0;

        for(let i = 0; i < lista.length; i++) {
            soma+=lista[i];
        }
        
        div_result.innerHTML=`Você tem ${lista.length} produtos cadastrados em estoque<br>
        seu estoque vale R$${soma.toFixed(2)}`
    }
</script>

<!-- a) Pergunte ao usuário o preço de um produto; 

b) Ao clicar em "Cadastrar", o preço fica cadastrado num lugar que o usuário não vê; 

c) Ao clicar em "Atualizar Estoque", deve aparecer a lista de preços cadastrados (em ordem inversa) e um texto como este abaixo:  

   Você tem X produtos cadastrados em estoque  

   Seu estoque vale R$Y 

Em que X é a quantidade de produtos cadastrados pelo usuário e Y é a soma de todos os valores.  -->
