<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    Informe o nome de cada projeto que você ja fez
    <input type="text" id="ipt_projeto">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="verTodos()">Ver todos</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    lista = []
    function cadastrar() {
        let projeto = ipt_projeto.value;
        lista.push(projeto)

        div_result.innerHTML=``
        for(let i = 0; i < lista.length; i++){
            if(i >= 0 && i <= 4){
        div_result.innerHTML=`Você já fez ${i + 1} projetos. Por isso você é um profissional Júnior`
            } else if(i > 4 && i <= 12) {
        div_result.innerHTML=`Você já fez ${i + 1} projetos. Por isso você é um profissional Pleno`
            }else if(i >= 13){
        div_result.innerHTML=`Você já fez ${i + 1} projetos. Por isso você é um profissional Sênior`
            }
        }
    }

    function verTodos() {
        div_result.innerHTML=``
        for(let i = lista.length - 1; i >= 0; i--){
            div_result.innerHTML+=`${lista[i]}<br>`
        }
    }
</script>
