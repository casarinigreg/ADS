<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
</head>
<body>
    insira o nome de um de seus filhos
    <input type="text" id="ipt_filho">
    <br>
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="atualizar()">Atualizar família</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    let lista = [];
    function cadastrar(){
        let filho = ipt_filho.value;

        if(lista.includes(filho)) {
            alert('Não pode mais de 1 filho com o mesmo nome!')
        } else{
            lista.push(filho)
        }
    }

    function atualizar(){
        if(lista.length == 1){
            div_result.innerHTML=`Você tem ${lista.length} filho<br>`

        }else{
            div_result.innerHTML=`Você tem ${lista.length} filhos<br>`

        }
        div_result.innerHTML+=`Seu custo mensal será aproximadamente R$${(lista.length * 3000).toFixed(2)} se colocá-los em escola particular ou R$${(lista.length * 1500).toFixed(2)} se eles estudarem em escola pública`
    }
</script>
<!-- 
a) Pergunte ao usuário o nome de um de seus filhos; 

b) Ao clicar em "Cadastrar", o nome do filho fica cadastrado num lugar que o usuário não vê, porém não permita o cadastro de nomes repetidos.  

b.1) Em caso de tentativa de nome repetido, exiba um alert com a frase "Não pode mais de 1 filho com o mesmo nome!"  

c) Ao clicar em "Atualizar Família", deve aparecer um texto como este abaixo:  

   Você tem X filhos  

   Seu custo mensal será aproximadamente R$Y se colocá-los em escola particular ou R$Z se eles estudarem em escola pública  

   Em que X é a quantidade de filhos cadastrados.  

   Y é o resultado do seguinte cálculo: filhos x 3000 

   Z é o resultado do seguinte cálculo: filhos x 1500  -->
