<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
</head>
<body>
    <label for="ipt_num">Insira um número: </label>
    <input type="number" id="ipt_num">
    <br>
    <button onclick="verificar()">Adoro múltiplos de 5</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    
    function verificar(){
        let num = Number(ipt_num.value)
        let contador = 0;

        div_result.innerHTML=``
        while(contador <= num) { 
            div_result.innerHTML += `${contador}<br>`
            contador += 5
        }
       
    }
</script>

<!--
a) Receba do usuário um número (tem que ser entre 20 e 100)  

b) Ao clicar num botão "Adoro múltiplos de 5"...   

c) Exiba, debaixo do botão, todos os múltiplos de 5 entre 0 e o número informado em a), um embaixo do outro. Ex: 5, 10, 15, 20...   

-->
