<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 22</title>
</head>
<body>
    <h1></h1>
    <label for="ipt_comeco">Insira um número maior que 1: </label>
    <input type="number" id="ipt_comeco">
    <br>
    <label for="ipt_limite">Insira um limite(maior que o número inserido acima): </label>
    <input type="number" id="ipt_limite">
    <br>
    <label for="ipt_div">Insira um número(de 3 a 10) para testar a divisibilidade: </label>
    <input type="number" id="ipt_div">
    <br>
    <button onclick="dividir()">Contar</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function dividir(){
        let comeco = Number(ipt_comeco.value);
        let limite = Number(ipt_limite.value);
        let div = Number(ipt_div.value);
        let contador = comeco;
        let qtd = 0;
        let soma = 0;
        let media = 0;
        let menor = 0;
        let maior = 0;

        div_result.innerHTML=``
        if(comeco > 1 && (limite > comeco && limite < 100) && (div >= 3 && div <= 10) ) {
            while(contador <= limite) {
                if(contador % div == 0) {
                    div_result.innerHTML+=`${contador}, `
                    qtd++
                    soma+= contador
                    media= soma / qtd
                    if(qtd == 1){
                        menor = contador
                    }
                    maior = contador
                }
                contador++
            }
                    
                    div_result.innerHTML+=`<br>QUANTIDADE TOTAL DE NÚMERO EXIBIDOS: ${qtd}<br>
                    SOMATÓRIO DOS NÚMEROS EXIBIDOS: ${soma}<br>
                    MÉDIA DOS NÚMEROS EXIBIDOS: ${media}<br>
                    MENOR NÚMERO: ${menor}<br>
                    MAIOR NÚMERO: ${maior}`


        } else {
            alert('Insira um número válido!')
        }
    
    }
</script>
<!-- a) Receba o limite inferior da amostragem. Esse número que ser maior que 1, caso contrário emitir mensagem explicativa e não seguir em frente.  

b) Receba o limite superior da amostragem. Esse número que ser menor que 100 e maior que o limite inferior (item a), caso contrário emitir mensagem explicativa e não seguir em frente 

c) Receba o número para testar a divisibilidade, esse número tem que estar entre 3 e 10, caso contrário, emitir mensagem explicativa e não seguir em frente. 

d) Tenha num botão "Contar" que quando clicado exiba todos os números divisíveis pelo número informado no item c), desde o limite inferior (item a.) até o limite superior (item b.). Exibir esses números um ao lado do outro separados por uma vírgula e um espaço (, ).  

e) Ao final, sem apagar as mensagens anteriores mostre as seguintes mensagens: 

    QUANTIDADE TOTAL DE NÚMEROS EXIBIDOS: 99 

    SOMATÓRIO DOS NÚMEROS EXIBIDOS: 999 

    MÉDIA DOS NÚMEROS EXIBIDOS: 99,99 

    MAIOR NÚMERO EXIBIDO: 99 

    MENOR NÚMERO EXIBIDO: 99  -->
