<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <label for="ipt_dividendo">Insira um dividendo: </label>
    <input type="number" id="ipt_dividendo">
    <br>
    <label for="ipt_divisor">Insira um divisor: </label>
    <input type="number" id="ipt_divisor">
    <br>
    <button onclick="dividir()">Dividir</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function dividir() {
        let dividendo = Number(ipt_dividendo.value);
        let divisor = Number(ipt_divisor.value);
        let quociente = 0;
        let resultado = dividendo / divisor;
        let resto = dividendo

        while(resto >= divisor) {
            resto = resto - divisor
            quociente++
        }

        div_result.innerHTML=`Resultado da divisão: ${quociente}<br>
        Resto:${resto}`

    }
</script>
