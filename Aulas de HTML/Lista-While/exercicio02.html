<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>
    Diga algo sobre a matéria de algoritmo: 
    <button onclick="exibir()">exibir</button>
    <div id="div_result"></div>
</body>
</html>
<script>
let contador = 0;

    function exibir() {
        let frase = "A matéria de algoritmo é muito legal"

        while(contador <= 7) {
            div_result.innerHTML+=`${frase} <br>`
            contador++
        }
    }
</script>

a) Tenha um botão "Diga algo sobre a matéria de Algoritmos";
