<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 18</title>
</head>
<body>
    <h1>Divisores</h1>
    <label for="ipt_divisores">Insira um número de 0 a 100</label>
    <input type="number" id="ipt_divisores">
    <br>
    <button onclick="dividir()">Ver divisores</button>
    <br>
    <div id="div_result"></div>
</body>
</html>
<script>
    function dividir() {
        let num = Number(ipt_divisores.value);
        let contador = 0;

        div_result.innerHTML=``
        while(contador <= 100) {
            if(num % contador == 0){
                div_result.innerHTML+=`${contador} <br><br>`
                
            }

            contador++
        }
    }
</script>

a) Receba um número do usuário, que deve estar entre 0 e 100;

     Divisores do Número 10:
