<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>
</head>
<body>
        <label for="ipt_num">Informe quantas vezes a frase será repetida: </label>
        <input type="number" id="ipt_num">
        <br>
        <label for="ipt_frase">Insira uma frase: </label>
        <input type="text" id="ipt_frase">
        <br>
        <button onclick="repetir()">Papagaio Repetitivo</button>
        <div id="div_result"></div>
</body>
</html>
<script>
    function repetir() {
        let num = Number(ipt_num.value);
        let frase = ipt_frase.value;
        let fraseRepetida = `${frase} `;
        let contador = 1;

        div_result.innerHTML=``
        while(contador <= num) {

            div_result.innerHTML+=`${contador}. ${fraseRepetida} <br>`
            alert(`${frase.repeat(num)}`)

            contador+= 1
            fraseRepetida+= `${frase} `
        }

    }
</script>
