<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <button onclick="filtrar()">Filtrar números cabalísticos</button>
    <div id="div_result"></div>
</body>
</html>
<script>
let contador = 0;
    function filtrar() {

        while(contador < 30) {
            contador += 1
            if(contador == 3 || contador == 4) {
                contador += 2
            }

            if(contador == 7 || contador == 10 || contador == 12) {
                contador++
            }
            div_result.innerHTML+=`${contador}<br>`
        }
    }
</script>
<!--
a) Ao clicar num botão "Filtrar números Cabalísticos"...   

c) Exiba, debaixo do botão, os números de 1 a 30, um embaixo do outro, PORÉM, NÃO devem aparecer os números 3, 4, 7, 10 e 12.

OBS: não se atenha ao termo "cabalístico", o que importa é somente travar essa sequência de números citada.
-->
