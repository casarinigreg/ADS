<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 15</title>
</head>
<body>
    <h1>É TRI, É PENTA!</h1>
    <label for="ipt_inter1">Insira um numero para começar: </label>
    <input type="number" id="ipt_inter1">
    <br>
    <label for="ipt_inter2">Insira um numero para terminar: </label>
    <input type="number" id="ipt_inter2">
    <br>
    <button onclick="verificar()">Curto 3 e 5</button>
    <br>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let contador = Number(ipt_inter1.value);
        let intervalo = Number(ipt_inter2.value);

            div_result.innerHTML=``
        while(contador < intervalo) {
            if(contador % 3 == 0){
                div_result.innerHTML+=`É TRI! <br>`
                contador++
            }
            if(contador % 5 == 0){
                div_result.innerHTML+=`É PENTA! <br>`
                contador++
            }
            div_result.innerHTML+=`${contador} <br>`
            contador++
        }
    }
</script>
