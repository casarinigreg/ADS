<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
</head>
<body>
    qual tabuada deseja ver:
    <input type="number" id="ipt_tabuada">
    <br>
    até que número: 
    <input type="number" id="ipt_num">
    <br>
    <button onclick="verificar()">Ver tabuada</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    contador = 0;

    function verificar() {
        let tabuada = Number(ipt_tabuada.value);
        let num = Number(ipt_num.value);
        

        while(contador <= num) {
            let resultado = (tabuada * contador)
            if(resultado % 2 == 0) {
                contador+= 1 
            div_result.innerHTML+=`<span style="color: blue">${tabuada} x ${contador} = ${resultado}</span><br>`
            } else if(resultado % 2 == 1) {
            div_result.innerHTML+=`<span style="color: red">${tabuada} x ${contador} = ${resultado}</span><br>`
                contador+= 1
              
            }
        }

    }
</script>

a) Pergunte, numa input ou lista suspensa (select/option), qual a tabuada que o usuário quer ver na tela (2 a 9);  

b) Pergunte até que número a tabuada deve ser construída;  

c) Ao clicar no botão “Ver Tabuada”, exiba abaixo a tabuada como neste exemplo (considerando que o usuário escolheu a tabuada do 3 e para ir até o 12).  

    3 x 1 = 3   

    3 x 2 = 6   

    3 x 3 = 9   

    3 x 4 = 12   

    3 x 5 = 15   

    3 x 6 = 18

    3 x 10 = 30   

    3 x 11 = 33   

    3 x 12 = 36   

d) Observar que quando o multiplicador for ímpar, a linha deve aparecer na cor vermelha e quando for par, na cor azul.

Ex: "3 x 1 = 3" aparecer em vermelho, mas "3 x 4 = 12" aparece em azul.   
-->
