<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 9</title>
</head>
<body>
    <label for="ipt_num">Insira um número: </label>
    <input type="number" id="ipt_num">
    <br>
    <button onclick="verificar()">Viva o 7</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar(){
        let num = Number(ipt_num.value)
        let contador = 0;

        if(num <= 200){div_result.innerHTML=``
        while(contador <= num) { 
            div_result.innerHTML += `${contador}<br>`
            contador += 7
        }
        } else {
            div_result.innerHTML=`insira um valor até 200!`
        }
    }
</script>
<!--
Crie um programa o qual:

a) Receba um número (tem que estar entre 0 e 200);  

b) Ter um botão chamado "Viva o 7!"   

c) Ao clicar nesse botão, devem aparecer todos os múltiplos de 7 entre 0 e o número informado em a)
-->
