<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <label for="ipt_pessoa">Pessoa que você mais ama: </label>
    <input type="text" id="ipt_pessoa">
    <br>
    <label for="ipt_amor">O quanto você ama essa pessoa: </label>
    <input type="number" id="ipt_amor">
    <br>
    <button onclick="amar()">Expressar amor</button>
    <div id="div_result"></div>
</body>
</html>
<script>
let contador = 1;
    function amar() {
    let pessoa = ipt_pessoa.value;
    let amor = Number(ipt_amor.value);
    
    
        while(contador <= amor) {
            div_result.innerHTML+=`${contador} . ${pessoa}, EU TE AMO! SEMPRE LEMBRE DISSO! <br>`
            contador++
        }
    }

</script>

<!--
Crie um programa o qual:

a) Pergunte o nome da pessoa que o usuário mais ama na vida

b) Pergunte o quanto o usuário a ama (um número inteiro)

c) Ao clicar num botão "Expressar amor", devem aparecer, abaixo dele, N vezes (conforme o valor em b)) a frase indicada em a), como neste exemplo (considerando o nome "Lady Gaga" e que ama "3")   

      1 - Lady Gaga, eu te amo! Sempre lembre disso!   

      2 - Lady Gaga, eu te amo! Sempre lembre disso!   

      3 - Lady Gaga, eu te amo! Sempre lembre disso!
