<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7</title>
</head>
<body>
     <button onclick="pares()">S2 Pares</button>
     <div id="div_result"></div>
</body>
</html>
<script>
let contador = 0;

    function pares(){
        while(contador <= 100) {
           
            div_result.innerHTML+=`${contador}<br>`
            contador += 2
        }
    }
</script>
<!--
Crie um programa o qual:
 
a) Ao clicar num botão "S2 Pares"...  

b) Exiba, debaixo do botão, todos os números pares de 0 a 100, um embaixo do outro.

OBS: ao percorrer os números de 0 a 100, como validamos se o número atual é par, para ser exibido?  
-->
