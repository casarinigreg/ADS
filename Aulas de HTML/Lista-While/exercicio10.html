<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="ipt_intervalo1">
    <input type="number" id="ipt_intervalo2">
   <button onclick="pares()">S2 Pares</button>
     <div id="div_result"></div>
</body>
</html>
<script>
function pares(){
        let intervalo2 = Number(ipt_intervalo2.value);
        let intervalo1 = Number(ipt_intervalo1.value);

        div_result.innerHTML=``
        while(intervalo1 <= intervalo2) {
           
            div_result.innerHTML+=`${intervalo1}<br>`
            intervalo1 += 2
        }
    }
</script>
