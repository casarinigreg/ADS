<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 16</title>
</head>
<body>
    <h1>Musculação</h1>
    <label for="ipt_dias">Informe qunatos dias você faz musculação: </label>
    <input type="number" id="ipt_dias">
    <br>
    <button onclick="verificar()">Rotina mensal</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let dias = Number(ipt_dias.value);
        let contador = 0;


        div_result.innerHTML=``
        while(contador < 30) {
            if(contador == 0){
                contador++
            }

            if(contador % dias == 1) {
                div_result.innerHTML+=`Dia ${contador} - Musculação <br>`
                contador++
            }

            div_result.innerHTML+=`Dia ${contador} - Comer, dormir ETC <br>`
            contador++
        }
        
    }
</script>
<!-- a) Pergunte de quantos em quantos dias o usuário faz musculação (é só uma informação, só 1 número, ok?)   

b) Ao clicar em "Exibir rotina mensal", mostre uma sequência de 30 frases, como neste exemplo:   

         Dia 1 - Musculação   

         Dia 2 - Comer, dormir etc   

         Dia 3 - Comer, dormir etc   

         Dia 4 - Musculação   

         Dia 5 - Comer, dormir etc   

         Dia 6 - Comer, dormir etc   

         Dia 7 - Musculação   

         ...   

         Dia 30 - Comer, dormir etc    -->
