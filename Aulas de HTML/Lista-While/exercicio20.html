<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 20</title>
</head>
<body>
    <h1>Somar pares</h1>
    <label for="ipt_num">Insira um número: </label>
    <input type="number" id="ipt_num">
    <br>
    <button onclick="somar()">Somar pares</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function somar(){
        let num = Number(ipt_num.value);
        let contador = 1;
        let soma = 0;

        if(num >= 10 && num <= 500){
            while(contador < num) {
                if(contador % 2 == 0) {
                    div_result.innerHTML+=`${contador}<br><br>`
                    soma+= contador
                }
                contador++
            }
            div_result.innerHTML+=`Soma dos pares: ${soma}`
            
        } else {
            alert('Insira um número válido')
        }
    }
</script>

<!-- Crie  um programa o qual:

a) Solicite um número, que deve estar entre 10 e 500, exibindo alerta de erro caso não atenda os critérios;

b) Ao clicar no botão "Somar Pares", deve exibir todos os números pares entre 1 e o número inserido pelo usuário;

c) Ao final da listagem, deve exibir a frase "Soma dos pares: X", sendo X a soma de todos os números exibidos;
 -->
