<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <h1>contador</h1>
    <button onclick="contar()">Contar</button>
    <div id="div_result"></div>
</body>
</html>
<script>

    let contador = 0;
    function contar() {

        while(contador <= 15) {
            div_result.innerHTML+=`${contador} <br>`
            contador++
        }
    }
</script>
