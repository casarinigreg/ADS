<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>
<body>
    <button onclick="contar()">Contar</button>
    <div id="div_result"></div>
</body>
</html>
<script>

contador = 0;
    function contar() {
       
        if(contador <= 100){
            div_result.innerHTML+=`${contador} <br>`
            contador += 1
        }

    }
</script>
