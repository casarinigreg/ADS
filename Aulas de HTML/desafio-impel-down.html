<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impel Down</title>
</head>
<body>
    Quantidade de batalhas
    <input type="number" id="ipt_batalhas">
    <br>
    Marinheiros por batalhas
    <input type="number" id="ipt_marinheiros">
    <br>
    Quantidade de carnes
    <input type="number" id="ipt_carnes">
    <br>
    <button onclick="batalhar()">Iniciar batalha</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function batalhar(){
        let batalhas = Number(ipt_batalhas.value);
        let marinheiros = Number(ipt_marinheiros.value);
        let carnes = Number(ipt_carnes.value);
        let energia = 100;
        let derrotados = 0;
            
            if(energia > 10){
                for(let j = 0; j < batalhas; j++){
                    energia -= 10
                    for( let k = marinheiros ; k > 0; k--) {
                    if(energia <= 5 && carnes > 0){
                        energia -= 5 
                        carnes--
                        energia += 100
                        derrotados++
                    } else {
                        energia -= 5
                        derrotados++
                    }
                    }
                }
            }

            marinheirosRestantes = batalhas * marinheiros

        if(marinheiros < 0){
            div_result.innerHTML=`Resultado: Luffy venceu a marinha! <br> 
            Quantidade de carnes restantes: ${carnes} <br>
            Quantidade de marinheiros derrotados: ${derrotados} <br>
            Energia restante ao final das batalhas: ${energia}`
        } else {
            div_result.innerHTML=`Resultado: A marinha capturou o Luffy! Sobraram ${marinheirosRestantes} marinheiros <br> 
            Quantidade de carnes restantes: ${carnes} <br>
            Quantidade de marinheiros derrotados: ${derrotados} <br>
            Energia restante ao final das batalhas: ${energia}`
        }

    }
</script>
