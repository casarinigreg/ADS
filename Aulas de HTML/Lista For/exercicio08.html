<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Exercício 8</title>
</head>
<body>
    informe um numero entre 20 e 100
    <input type="number" id="ipt_intervalo">
    <br>
    <button onclick="contar()">Adoro múltiplos de 5</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function contar(){
        let num = Number(ipt_intervalo.value);

        for(i = 5; i <= num; i++) {
            if(i % 5 == 0) {
                div_result.innerHTML+=`${i}<br>`
            }
        }
    }
</script>
