<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    quantas voltas o seu carro dará na corrida 
    <input type="number" id="ipt_voltas">
    <br>
    <button onclick="correr()">Iniciar corrida</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function correr(){

        let voltas = Number(ipt_voltas.value);

        for(let i = 1; i <= voltas; i++){
            div_result.innerHTML+=`Carro dando a ${i}º volta<br>`
        }
        div_result.innerHTML+=`Corrida finalizada!`
    }

</script>
