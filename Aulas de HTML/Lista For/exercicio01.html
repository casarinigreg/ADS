<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    Informe quantas pessoas irão entrar no carro
    <input type="number" id="ipt_passageiros">
    <br>
    Informe qual a capacidade máxima do veículo
    <input type="number" id="ipt_capacidade">
    <br>
    <button onclick="partir()">Partiu carona</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function partir() {
        let passageiros = Number(ipt_passageiros.value);
        let capacidade = Number(ipt_capacidade.value);


        div_result.innerHTML=``
        for(let i = 1; i <= passageiros; i++) {
            if(i == 1) {
                div_result.innerHTML+=`Entrou o ${i}º passageiro(que é o(a) motorista)<br>`
            } else if(i <= capacidade) {
                div_result.innerHTML+=`Entrou o ${i}º passageiro<br>`
            } else {
                div_result.innerHTML+=`O ${i}º passageiro terá que esperar <br>`

            }
        }
    }
</script>
