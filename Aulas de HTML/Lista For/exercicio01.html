<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <button onclick="contar()">Contar</button>
    <div id="div_result"></div>

<script>

        for(let i = 1; i <= 15; i++){
            div_result.innerHTML+=`${i}<br>`
        }
    }
</script>
