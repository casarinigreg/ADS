<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>
</head>
<body>
    informe uma frase
    <input type="text" id="ipt_frase">
    <br>
    informe quantas vezes a frase se repetirá
    <input type="number" id="ipt_qtd">
    <br>
    <button onclick="contar()">Papagaio repetitivo</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function contar(){
        let frase = ipt_frase.value;
        let qtd = Number(ipt_qtd.value);
        let repetirFrase = `${frase} `

        for(let i = 0; i <= qtd; i++) {
            div_result.innerHTML+=`${i} - ${repetirFrase}<br>`
            repetirFrase+= `${frase} `
        }
    }
</script>
