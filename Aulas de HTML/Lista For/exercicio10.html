<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>
    Informe um intervalo
    <input type="number" id="ipt_inter1">
    <br>
Informe quanto o intervalo acaba
    <input type="number" id="ipt_inter2">
    <br>
    <button onclick="contar()">S2 Pares</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function contar(){
        let intervalo = Number(ipt_inter1.value);
        let fim = Number(ipt_inter2.value);

        for(let i = intervalo; i <= fim; i++) {
            if(i % 2 == 0) {
                div_result.innerHTML+=`${i}<br>`
            }
        }
    }
</script>

a) Solicite um intervalo crescente de valores numéricos    

b) Ao clicar num botão "S2 Pares"...   

c) Exiba, debaixo do botão, todos os números pares contidos no intervalo.
