<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 9</title>
</head>
<body>
    informe um numero entre 20 e 100
    <input type="number" id="ipt_intervalo">
    <br>
    <button onclick="contar()">Adoro múltiplos de 7</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function contar(){
        let num = Number(ipt_intervalo.value);

        for(i = 7; i <= num; i++) {
            if(i % 7 == 0) {
                div_result.innerHTML+=`${i}<br>`
            }
        }
    }
</script> 

a) Receba um número (tem que estar entre 0 e 200);  

b) Ter um botão chamado "Viva o 7!"   

c) Ao clicar nesse botão, devem aparecer todos os múltiplos de 7 entre 0 e o número informado em a)
