<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
</head>
<body>
    qual tabuada você deseja ver(de 2 a 9)
    <input type="number" id="ipt_tabuada">
    <br>
    até qual número iremos contar
    <input type="number" id="ipt_fim">
    <br>
    <button onclick="contar()">Ver tabuada</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function contar(){
        let tabuada = Number(ipt_tabuada.value);
        let fim = Number(ipt_fim.value);

        for(let i = 1; i <= fim; i++){
            if(i % 2 == 0) {
            div_result.innerHTML+=`<span style="color: blue;">${tabuada} x ${i} = ${tabuada * i}<br></span>`
            } else{
            div_result.innerHTML+=`<span style="color: red;">${tabuada} x ${i} = ${tabuada * i}<br></span>`

            }
        }
    }
</script>
