<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    <button onclick="contar()">Filtrar números cabalísticos</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function contar(){
        
        for(let i = 1; i <= 30; i++) {
            if(i !== 3 && i !== 4 && i !== 7 && i !== 10 && i !== 12) {
                div_result.innerHTML+=`${i}<br>`
            }
        }
    }
</script>
