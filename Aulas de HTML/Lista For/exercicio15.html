<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 15</title>
</head>
<body>
    <h1>É TRI, É PENTA!</h1>
    <label for="ipt_inter1">Insira um numero para começar: </label>
    <input type="number" id="ipt_inter1">
    <br>
    <label for="ipt_inter2">Insira um numero para terminar: </label>
    <input type="number" id="ipt_inter2">
    <br>
    <button onclick="verificar()">Curto 3 e 5</button>
    <br>
    <div id="div_result"></div>
</body>
</html>
<script>
    function verificar() {
        let inicio = Number(ipt_inter1.value);
        let fim = Number(ipt_inter2.value);

        div_result.innerHTML = ``;

        for (let i = inicio; i < fim; i++) {
            if (i % 3 == 0) {
                div_result.innerHTML += `É TRI! <br>`;
            }
            if (i % 5 == 0) {
                div_result.innerHTML += `É PENTA! <br>`;
            }
            div_result.innerHTML += `${i} <br>`;
        }
    }
</script>
