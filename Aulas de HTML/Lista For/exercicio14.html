<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 14</title>
</head>
<body>
    <label for="ipt_inter1">Insira primeiro número do intervalo: </label>
    <input type="number" id="ipt_inter1">
    <br>
    <label for="ipt_inter2">Insira segundo número do intervalo: </label>
    <input type="number" id="ipt_inter2">
    <br>
    <label for="ipt_div">Insira um número para divisibilidade(3 a 13): </label>
    <input type="number" id="ipt_div">
    <br>
    <button onclick="dividir()">Divisível</button>
    <div id="div_result"></div>
</body>
</html>
<script>
    function dividir() {
        let inter1 = Number(ipt_inter1.value);
        let inter2 = Number(ipt_inter2.value);
        let div = Number(ipt_div.value);
        div_result.innerHTML = ``

        for(let i = inter1; i <= inter2; i++) {
            if(i % div !== 0) {
                div_result.innerHTML+=`${i} <br>`

            }
        }
    }
</script>
